version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdesk-postgres
    restart: always
    environment:
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: smartdesk_password
      POSTGRES_DB: smartdesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdesk -d smartdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdesk-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://smartdesk:smartdesk_password@postgres:5432/smartdesk_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.8-flash
      - EMBEDDING_MODEL=gemini-embedding-2-preview
      - SECRET_KEY=${SECRET_KEY:-smartdesk_super_secret_jwt_key_2026}
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdesk-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
